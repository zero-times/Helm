services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: helm
      POSTGRES_USER: helm
      POSTGRES_PASSWORD: helm
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helm -d helm"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - helm-postgres-data:/var/lib/postgresql/data

volumes:
  helm-postgres-data:
